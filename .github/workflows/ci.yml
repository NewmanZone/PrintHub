name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dotnet-build-and-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore PrintHub.sln

      - name: Build
        run: dotnet build PrintHub.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PrintHub.sln --no-build --configuration Release --verbosity normal

  frontend-build-and-test:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

  smoke-test:
    name: Smoke readiness
    needs: [dotnet-build-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test placeholder
        run: echo "smoke-test placeholder until API deployment exists"
