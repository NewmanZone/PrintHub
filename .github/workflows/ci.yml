name: CI

on:
  push:
    branches: [ main, fix/*, feat/* ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore PrintHub.sln

    - name: Build
      run: dotnet build PrintHub.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test PrintHub.sln --no-build --configuration Release --verbosity normal