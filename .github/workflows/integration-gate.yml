name: Integration Readiness Gate

on:
  workflow_dispatch:

jobs:
  readiness:
    name: Build, test, and deployment readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore .NET
        run: dotnet restore PrintHub.sln

      - name: Build .NET
        run: dotnet build PrintHub.sln --no-restore --configuration Release

      - name: Test .NET
        run: dotnet test PrintHub.sln --no-build --configuration Release --verbosity normal

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deployment readiness
        run: |
          echo "No deployment target is configured yet."
          echo "Gate passes when build, test, and frontend validation succeed."
