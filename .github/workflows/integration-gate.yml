name: Integration Readiness Gate

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API Base URL for smoke tests'
        required: true
        default: 'http://localhost:5000'
        type: string
      run_visual_checks:
        description: 'Run visual regression checks'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # Gate 1: Prerequisites
  prerequisites:
    name: Check Prerequisites
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.config.outputs.api_url }}
      run_visual: ${{ steps.config.outputs.run_visual }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - id: config
        run: |
          echo "api_url=${{ github.event.inputs.api_url || 'http://localhost:5000' }}" >> $GITHUB_OUTPUT
          echo "run_visual=${{ github.event.inputs.run_visual_checks || 'false' }}" >> $GITHUB_OUTPUT

      - name: Validate .NET SDK
        run: dotnet --version

  # Gate 2: Smoke Tests
  smoke-tests:
    name: 🔍 Smoke Tests Gate
    runs-on: ubuntu-latest
    needs: prerequisites
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PrintHub.sln

      - name: Build
        run: dotnet build PrintHub.sln --configuration Release --no-restore

      - name: Run Smoke Tests
        env:
          SmokeTests__ApiBaseUrl: ${{ needs.prerequisites.outputs.api_url }}
        run: |
          echo "API URL: ${{ needs.prerequisites.outputs.api_url }}"
          dotnet test src/PrintHub.Tests/PrintHub.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "Category=Smoke" \
            --logger "console;verbosity=detailed"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-output/smoke-results.json
          retention-days: 30

  # Gate 3: Unit Tests
  unit-tests:
    name: 🔍 Unit Tests Gate
    runs-on: ubuntu-latest
    needs: prerequisites

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PrintHub.sln

      - name: Build
        run: dotnet build PrintHub.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test src/PrintHub.Tests/PrintHub.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "Category!=Smoke" \
            --verbosity normal

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/TestResults/**/*.trx'
          retention-days: 30

  # Gate 4: Integration Readiness Assessment
  integration-readiness:
    name: 🔍 Integration Readiness Gate
    runs-on: ubuntu-latest
    needs: [prerequisites, smoke-tests, unit-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PrintHub.sln

      - name: Build
        run: dotnet build PrintHub.sln --configuration Release --no-restore

      - name: Run Integration Gate Evaluation
        run: |
          dotnet test src/PrintHub.Tests/PrintHub.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "Category=Integration" \
            --verbosity normal

      - name: Upload Gate Report
        uses: actions/upload-artifact@v4
        with:
          name: integration-gate-report
          path: test-output/integration-gates.json
          retention-days: 30

  # Final: Gate Decision
  gate-decision:
    name: 🚦 Gate Decision
    runs-on: ubuntu-latest
    needs: [prerequisites, smoke-tests, unit-tests, integration-readiness]
    if: always()

    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          path: reports/
          merge-multiple: true

      - name: Decision Summary
        run: |
          echo "## 🚦 Integration Readiness Gate Decision"
          echo ""
          echo "### Gate Results"
          echo ""
          echo "| Gate | Result |"
          echo "|------|--------|"
          echo "| **Smoke Tests** | ${{ needs.smoke-tests.result == 'success' && '✅ PASS' || needs.smoke-tests.result }} |"
          echo "| **Unit Tests** | ${{ needs.unit-tests.result == 'success' && '✅ PASS' || needs.unit-tests.result }} |"
          echo "| **Integration Readiness** | ${{ needs.integration-readiness.result == 'success' && '✅ PASS' || needs.integration-readiness.result }} |"
          echo ""
          
          # Determine final decision
          gate_status="APPROVED"
          if [[ "${{ needs.smoke-tests.result }}" != "success" ]]; then gate_status="BLOCKED"; fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then gate_status="BLOCKED"; fi
          if [[ "${{ needs.integration-readiness.result }}" != "success" ]]; then gate_status="BLOCKED"; fi
          
          echo "### 🎯 Final Decision: **$gate_status**"
          
          if [[ "$gate_status" == "APPROVED" ]]; then
            echo ""
            echo "✅ All critical gates passed. Integration can proceed."
          else
            echo ""
            echo "❌ Some gates failed. Please review the failures above."
            exit 1
          fi

      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: reports/
          retention-days: 30
