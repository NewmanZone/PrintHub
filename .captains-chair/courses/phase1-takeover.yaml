version: 1
key: phase1-takeover
repository: NewmanZone/PrintHub
kind: takeover
title: Complete PrintHub Phase 1
goal: Complete the documented PrintHub Phase 1 shared Etsy production workspace from
  authenticated entry through a verified manual preparation bundle, using bounded
  pull-request packages and explicit production-deployment approval.
non_goals:
- Automatic production deployment on merge
- Phase 2 printer automation, billing, subscriptions, or inventory forecasting
scope:
- Preserve the completed auth, workspace authorization, and deployment-safety foundations
- Complete PR #41 for workspace-scoped Etsy operations
- Implement every remaining Phase 1 lane in ISSUES_EXECUTION_PLAN.md
- Finish with API, UI, accessibility, security, and end-to-end exit verification
users:
- Authenticated workspace owners and accepted contributors
architecture_constraints:
- Etsy operations remain workspace scoped
- Authorization is enforced server side
- OAuth tokens remain encrypted at rest
- All changes use isolated worktrees and pull requests
- Completion remains supervised with owner_approval for this canary
- Live PR and CI proof comes from Captain's Chair authenticated GitHubProvider on
  OpenClaw
- Use GPT-5.5 only for readiness, independent review, and final review; cheaper coding
  and QA models require a passing model canary before use
acceptance_criteria:
- Production deployment remains manual and protected by an owner approval environment
- Every package receives current-head independent review, targeted tests, and final review
- UI packages receive functional, flow, cohesion, accessibility, and contrast QA
- Important findings are repaired and rechecked without repeating unchanged model calls
- Phase 1 supports the documented owner and contributor manual preparation workflow
- Completion obeys the configured owner_approval policy during the supervised canary
exit_criteria:
- All Phase 1 work packages are complete and their pull requests are merged
- Default-branch CI is verified after every merge
- The authenticated owner/contributor happy path passes from OAuth entry through bundle completion
- Workspace isolation, owner-only administration, encrypted tokens, and private file access are verified
- UI QA has no unresolved blocking usability, contrast, functionality, or cohesion finding
- Production deployment remains a separately approved action
- No shared-checkout branch or repeated no-progress transition is used
