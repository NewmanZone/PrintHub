work_packages:
- version: 1
  key: protect-production-deploy
  title: Make production deployment approval-safe
  objective: Remove push-to-main production deployment and document a bounded rollback
    procedure before any implementation PR can merge.
  dependencies: []
  acceptance_criteria:
  - deploy.yml runs production deployment only from workflow_dispatch
  - The selected environment remains explicit and protected by GitHub environment
    policy
  - A rollback runbook identifies the last known-good commit, manual redeploy steps,
    smoke verification, and approval boundaries
  - CI validates workflow syntax and documentation
  checks:
  - git diff --check
  qa_profiles: []
  checkpoint_keys: []
  model_profiles: {}
  risk: high
  status: planned
  source_issue: null
- version: 1
  key: complete-pr41
  title: Complete workspace-scoped Etsy operations PR
  objective: 'Drive PR #41 through independent review, tests, UI QA, repair if required,
    final review, and the configured completion gate.'
  dependencies:
  - protect-production-deploy
  acceptance_criteria:
  - Verify authentication, membership, owner-only administration, encrypted token
    storage, and sync/read consistency
  - Run backend, frontend, and relevant end-to-end checks
  - Exercise affected Settings and Etsy connection flows
  - Produce current-head final-review proof through authenticated GitHub state
  checks:
  - dotnet test PrintHub.sln --configuration Release
  - npm run test -- --run
  - npm run build
  - npm run test:e2e
  qa_profiles: []
  checkpoint_keys: []
